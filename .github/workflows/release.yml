name: Release

# Publishes Mailplane for macOS, Windows, Linux and Android to one GitHub Release.
#
# Two ways to release:
#   1. Locally:  npm run release:patch   (or :minor / :major)
#      bumps package.json, commits, tags vX.Y.Z and pushes → this workflow runs.
#   2. GitHub:   Actions → Release → Run workflow → pick patch / minor / major,
#                or "current" to release the version already in package.json.
#
# Flow: create a draft release → build all platforms in parallel and upload
# into the draft → publish it with generated release notes once everything
# succeeded. A failed platform leaves the draft unpublished (nothing half-released).
#
# Optional repository secrets:
#   macOS signing/notarisation: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
#                               APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows signing:            WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   Android signing:            ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#                               ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the builds are unsigned (Android falls back to the debug key).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, current]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bump }}" == "current" ]]; then
            VERSION=$(node -p "require('./package.json').version")
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              # Rebuilding a release that was never published: move its tag to this commit
              DRAFT=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
              if [[ "$DRAFT" == "false" ]]; then
                echo "::error::v$VERSION is already published. Bump the version to release again."
                exit 1
              fi
              git tag -f "v$VERSION"
              git push -f origin "v$VERSION"
            else
              git tag "v$VERSION"
              git push origin "v$VERSION"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            RAW=$(npm version ${{ inputs.bump }} --no-git-tag-version)
            VERSION="${RAW#v}"
            git commit -am "Release v$VERSION"
            git tag "v$VERSION"
            git push origin HEAD --follow-tags
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Mailplane $TAG" --notes "Building…" --verify-tag

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Sync version
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      # postinstall rebuilds better-sqlite3 against Electron for this OS
      - run: npm ci
      - name: Build and upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Unset secrets that aren't configured: electron-builder treats an empty
          # CSC_LINK as a file path and fails, instead of building unsigned
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.platform }} --publish always

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MAILPLANE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so it can't update an earlier install in place."
          fi
      - name: Test engine and build release APK
        working-directory: android
        env:
          MAILPLANE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAILPLANE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAILPLANE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease
      - name: Upload APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="Mailplane-${{ needs.prepare.outputs.version }}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "${{ needs.prepare.outputs.tag }}" "$APK" --clobber

  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          NOTES=$(gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq '.body')
          DOWNLOADS=$(cat <<'MD'
          ## Downloads

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | `Mailplane-VERSION-mac-arm64.dmg` |
          | macOS (Intel) | `Mailplane-VERSION-mac-x64.dmg` |
          | Windows | `Mailplane-VERSION-windows-setup.exe` |
          | Linux | `Mailplane-VERSION-linux-x64.AppImage` or `Mailplane-VERSION-linux-amd64.deb` |
          | Android | `Mailplane-VERSION-android.apk` |

          Desktop apps update themselves once installed.
          MD
          )
          DOWNLOADS="${DOWNLOADS//VERSION/${{ needs.prepare.outputs.version }}}"
          gh release edit "$TAG" --repo "$REPO" --title "Mailplane $TAG" --notes "$DOWNLOADS

          $NOTES" --draft=false
      - name: Summary
        run: echo "### Mailplane ${{ needs.prepare.outputs.tag }} published for macOS, Windows, Linux and Android" >> "$GITHUB_STEP_SUMMARY"
