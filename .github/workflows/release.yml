name: Build and Release

# Two ways to trigger a release:
#
#   1. Push a version tag from your machine:
#        npm run release:patch   # or :minor / :major
#      That bumps package.json, commits, tags, and pushes — this workflow picks it up.
#
#   2. GitHub UI: Actions → Build and Release → Run workflow → choose patch/minor/major.
#      Useful when you can't push locally.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # push version commit + tag; create/edit GitHub Release

jobs:
  release:
    runs-on: macos-latest   # required for macOS DMG builds

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so generate-notes spans all commits

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Resolve which version we're releasing and normalise package.json.
      # • workflow_dispatch: bump via npm version, push the new commit + tag.
      #   (GITHUB_TOKEN pushes don't re-trigger workflows, so no infinite loop.)
      # • tag push: version is already in the tag; just sync package.json.
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            RAW=$(npm version ${{ inputs.bump }})
            VERSION="${RAW#v}"
            git push origin HEAD --follow-tags
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            # Sync package.json without creating a new commit/tag
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"      >> "$GITHUB_OUTPUT"

      # npm ci runs postinstall → electron-rebuild for better-sqlite3
      - name: Install dependencies
        run: npm ci

      # electron-builder creates DMG + ZIP (arm64 + x64) and uploads them plus
      # latest-mac.yml to a new GitHub Release.  The yml file is what
      # electron-updater fetches on every app launch to detect new versions.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # skip ad-hoc signing on unsigned CI builds
          # Uncomment once you have an Apple Developer ID cert in repo secrets:
          # CSC_LINK:                     ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD:             ${{ secrets.CSC_KEY_PASSWORD }}
          # APPLE_ID:                     ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD:  ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always

      # Rename the release and attach auto-generated changelog from GitHub
      - name: Set release title and changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="Mailplane $TAG"
          BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq '.body')
          gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --draft=false

      - name: Job summary
        run: |
          V="${{ steps.ver.outputs.version }}"
          echo "### Mailplane v$V released 🚀"                                   >> "$GITHUB_STEP_SUMMARY"
          echo ""                                                                  >> "$GITHUB_STEP_SUMMARY"
          echo "- DMG + ZIP for arm64 + x64 uploaded to GitHub Releases"          >> "$GITHUB_STEP_SUMMARY"
          echo "- \`latest-mac.yml\` published — electron-updater will pick it up" >> "$GITHUB_STEP_SUMMARY"
