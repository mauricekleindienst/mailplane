<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mailplane — the envelope's flap has folded into a paper plane and taken off -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363c38"/>
      <stop offset="1" stop-color="#1a1d1b"/>
    </linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7f6"/>
      <stop offset="1" stop-color="#dde2df"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1fbaa"/>
      <stop offset="1" stop-color="#d6ec67"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
  <!-- envelope, open: its flap has folded into the plane -->
  <path d="M236 500 L512 676 L788 500 V736 a56 56 0 0 1 -56 56 H292 a56 56 0 0 1 -56 -56 Z" fill="url(#env)"/>
  <path d="M236 500 L512 676 L788 500" fill="none" stroke="#aeb6b1" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- trail -->
  <path d="M352 452 C 372 352, 452 300, 548 316" fill="none" stroke="#d6ec67" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 44" opacity=".8"/>
  <!-- paper plane -->
  <g transform="translate(560 206) rotate(-6)">
    <path d="M232 0 L0 104 L96 142 Z" fill="url(#wing)"/>
    <path d="M232 0 L96 142 L126 236 Z" fill="#b8d041"/>
    <path d="M96 142 L126 236 L150 170 Z" fill="#9fb832"/>
  </g>
</svg>
